  <g id="labels" font-family="Arial, Helvetica, sans-serif" fill="#27272A" text-anchor="middle">
    <text x="884.3" y="419.6" font-size="18">The Cardiovascular</text>
    <text x="884.3" y="442.7" font-size="18">System</text>
    <text x="1065.1" y="429.8" font-size="14">Blood flow</text>
    <text x="1205.8" y="283.2" font-size="12">Pulmonary circuit</text>
    <text x="1437" y="199.6" font-size="10.5">Deoxygenated blood enters the</text>
    <text x="1437" y="213.1" font-size="10.5">right atrium</text>
    <text x="1437.6" y="250.5" font-size="10.5">Pumped through the tricuspid</text>
    <text x="1437.6" y="264" font-size="10.5">valve into the right ventricle</text>
    <text x="1422.5" y="301.4" font-size="10.5">Sent to the lungs via the</text>
    <text x="1422.5" y="314.8" font-size="10.5">pulmonary artery</text>
    <text x="1434.4" y="352.3" font-size="10.5">Oxygenated blood returns via</text>
    <text x="1434.4" y="365.7" font-size="10.5">pulmonary veins</text>
    <text x="1202.1" y="454.6" font-size="12">Systemic circuit</text>
    <text x="1431.5" y="403.2" font-size="10.5">Oxygenated blood arrives in</text>
    <text x="1431.5" y="416.6" font-size="10.5">the left atrium</text>
    <text x="1432.7" y="454" font-size="10.5">Passes the mitral valve into</text>
    <text x="1432.7" y="467.5" font-size="10.5">the left ventricle</text>
    <text x="1421.9" y="504.9" font-size="10.5">Leaves through the aorta</text>
    <text x="1216.1" y="600.5" font-size="12">Coronary circulation</text>
    <text x="1421.6" y="542.4" font-size="10.5">Left coronary artery and</text>
    <text x="1421.6" y="555.8" font-size="10.5">branches</text>
    <text x="1425.4" y="593.2" font-size="10.5">Right coronary artery and</text>
    <text x="1425.4" y="606.7" font-size="10.5">branches</text>
    <text x="1432.7" y="644.1" font-size="10.5">Cardiac veins drain into the</text>
    <text x="1432.7" y="657.6" font-size="10.5">coronary sinus</text>
    <text x="707.8" y="251.7" font-size="14">The heart</text>
    <text x="568.8" y="251" font-size="12">Heart structure</text>
    <text x="375.9" y="69.7" font-size="10.5">Four chambers</text>
    <text x="125.8" y="51.3" font-size="9.5">Right atrium and right ventricle</text>
    <text x="131.8" y="87.5" font-size="9.5">Left atrium and left ventricle</text>
    <text x="381.4" y="178.2" font-size="10.5">Four valves</text>
    <text x="181.7" y="123.6" font-size="9.5">Tricuspid</text>
    <text x="181.2" y="159.8" font-size="9.5">Pulmonary</text>
    <text x="163" y="196" font-size="9.5">Mitral (bicuspid)</text>
    <text x="189.4" y="232.1" font-size="9.5">Aortic</text>
    <text x="364.2" y="304.8" font-size="10.5">Layers of the wall</text>
    <text x="176.2" y="268.3" font-size="9.5">Endocardium</text>
    <text x="178" y="304.4" font-size="9.5">Myocardium</text>
    <text x="176.2" y="340.6" font-size="9.5">Pericardium</text>
    <text x="374.7" y="413.2" font-size="10.5">Great vessels</text>
    <text x="182.8" y="376.8" font-size="9.5">Vena cava</text>
    <text x="140.3" y="412.9" font-size="9.5">Pulmonary artery and veins</text>
    <text x="191.8" y="449.1" font-size="9.5">Aorta</text>
    <text x="701.5" y="646.8" font-size="14">Physiology</text>
    <text x="559.5" y="544.3" font-size="12">Cardiac conduction</text>
    <text x="334.2" y="486.2" font-size="10.5">Sinoatrial (SA) node sets the</text>
    <text x="334.2" y="499.6" font-size="10.5">pace</text>
    <text x="340.3" y="537.1" font-size="10.5">Atrioventricular (AV) node</text>
    <text x="340.3" y="550.5" font-size="10.5">relays the signal</text>
    <text x="340.3" y="588" font-size="10.5">Bundle of His and Purkinje</text>
    <text x="340.3" y="601.4" font-size="10.5">fibers</text>
    <text x="576.2" y="671.5" font-size="12">Cardiac cycle</text>
    <text x="346.7" y="638.9" font-size="10.5">Systole: contraction and</text>
    <text x="346.7" y="652.3" font-size="10.5">ejection</text>
    <text x="346.1" y="689.7" font-size="10.5">Diastole: relaxation and</text>
    <text x="346.1" y="703.2" font-size="10.5">filling</text>
    <text x="537.1" y="773.3" font-size="12">Blood pressure essentials</text>
    <text x="351.1" y="740.6" font-size="10.5">Systolic and diastolic</text>
    <text x="351.1" y="754.1" font-size="10.5">readings</text>
    <text x="331.5" y="791.5" font-size="10.5">Cardiac output and peripheral</text>
    <text x="331.5" y="804.9" font-size="10.5">resistance</text>
  </g>
</svg>
