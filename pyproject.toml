[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mindmap-from-list-cli"
version = "0.1.0"
description = "Offline CLI that turns a plain indented or Markdown list into a printable mind map (SVG + PDF), with colorblind-safe palettes and optional AI study questions."
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "Asdale Dynamics, LLC" }]
keywords = ["mindmap", "outline", "svg", "pdf", "offline", "study", "markdown"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Education",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Topic :: Text Processing :: Markup",
]
dependencies = []

[project.urls]
Homepage = "https://dylanasdale.github.io"

[project.scripts]
mindmap-from-list = "mindmap_from_list.cli:main"

[tool.setuptools.packages.find]
include = ["mindmap_from_list*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
